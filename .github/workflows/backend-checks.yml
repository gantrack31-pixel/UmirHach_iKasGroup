name: Backend checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    defaults:
      run:
        working-directory: backend/online-dekanat-backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/online-dekanat-backend/requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest
